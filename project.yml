name: HabitTracker
options:
  bundleIdPrefix: com.henrieckhardt.habittracker
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: YVY36N9DTR
    CODE_SIGN_STYLE: Automatic
targets:
  HabitTracker:
    type: application
    platform: iOS
    sources:
      - path: HabitTracker
    info:
      path: HabitTracker/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Habit Tracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henrieckhardt.habittracker
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  HabitTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HabitTrackerTests
    dependencies:
      - target: HabitTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henrieckhardt.habittracker.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HabitTracker:
    build:
      targets:
        HabitTracker: all
        HabitTrackerTests: [test]
    test:
      targets:
        - HabitTrackerTests
    run:
      config: Debug
